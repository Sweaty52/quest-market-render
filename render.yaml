services:
  - type: web
    name: quest-market
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-market.txt
    startCommand: python -m bot.market_main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: BOT_MODE
        value: webhook
      - key: MARKET_BOT_TOKEN
        sync: false
      - key: MARKET_DATABASE_URL
        sync: false
      - key: MARKET_ALLOWED_USER_IDS
        sync: false
      - key: MARKET_ACCESS_CHAT_ID
        value: "-1004447182501"
      - key: BANK_USERNAME
        value: questbankk
      - key: OFFERS_GROUP_ID
        value: "-1004447182501"
      - key: GIFT_NOTIFICATION_RETRY_SECONDS
        value: "60"
      - key: MARKET_ACCOUNT_URL
        value: tg://send_gift?to=questbankk
